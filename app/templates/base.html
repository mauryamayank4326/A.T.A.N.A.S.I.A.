<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}M.A.U.R.Y.A. | Operations{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body class="min-h-screen">

    <div class="min-h-screen">

        <header class="border-b border-ops-border bg-ops-panel">
            <div class="mx-auto flex max-w-7xl items-center
                        justify-between px-6 py-4">

                <a href="/dashboard"
                   class="text-xl font-bold tracking-widest text-white">
                    M.A.U.R.Y.A.
                </a>

                <div class="text-xs font-medium uppercase
                            tracking-wider text-ops-muted">
                    Security Operations
                </div>

            </div>
        </header>

        <div class="mx-auto flex max-w-7xl">

            <aside class="hidden w-60 shrink-0
                          border-r border-ops-border
                          p-5 md:block">

                <p class="ops-label mb-5">Navigation</p>

                <nav class="space-y-2">

                    <a href="/dashboard"
                       class="block rounded-lg bg-slate-800
                              px-4 py-3 text-sm font-medium
                              text-sky-400">
                        Overview
                    </a>

                    <a href="/dashboard"
                       class="block rounded-lg px-4 py-3
                              text-sm text-slate-300
                              hover:bg-slate-800">
                        Reconnaissance
                    </a>

                    <a href="/dashboard"
                       class="block rounded-lg px-4 py-3
                              text-sm text-slate-300
                              hover:bg-slate-800">
                        Targets
                    </a>

                    <a href="/dashboard"
                       class="block rounded-lg px-4 py-3
                              text-sm text-slate-300
                              hover:bg-slate-800">
                        Telemetry
                    </a>

                </nav>

            </aside>

            <main class="min-w-0 flex-1 px-6 py-8">

                {% block content %}{% endblock %}

            </main>

        </div>

        <footer class="border-t border-ops-border px-6 py-5">
            <div class="mx-auto max-w-7xl text-xs text-ops-muted">
                M.A.U.R.Y.A. — Reconnaissance Operations Platform
            </div>
        </footer>

    </div>

    {% block scripts %}{% endblock %}

</body>
</html>
