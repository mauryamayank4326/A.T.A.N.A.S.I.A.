<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}M.A.U.R.Y.A. | Operations{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body class="min-h-screen">

    <div class="min-h-screen">

        <header class="border-b border-ops-border bg-ops-panel">
            <div class="mx-auto flex max-w-7xl items-center
                        justify-between px-6 py-4">

                <a href="{{ request.url_for('dashboard_overview') }}"
                   class="text-xl font-bold tracking-widest text-white">
                    M.A.U.R.Y.A.
                </a>

                <div class="text-xs font-medium uppercase
                            tracking-wider text-ops-muted">
                    Security Operations
                </div>

            </div>
        </header>

        <nav aria-label="Main navigation"
             class="mx-auto flex max-w-7xl flex-wrap items-center gap-4
                    border-b border-slate-800 px-6 py-4">

            <a href="{{ request.url_for('dashboard_overview') }}"
               {% if request.url.path == request.url_for('dashboard_overview').path %}
               aria-current="page"
               class="text-sm font-semibold text-cyan-400 hover:text-cyan-300"
               {% else %}
               class="text-sm text-slate-300 hover:text-white"
               {% endif %}>
                Overview
            </a>

            <a href="{{ request.url_for('dashboard_targets') }}"
               {% if request.url.path.startswith('/dashboard/targets') %}
               aria-current="page"
               class="text-sm font-semibold text-cyan-400 hover:text-cyan-300"
               {% else %}
               class="text-sm text-slate-300 hover:text-white"
               {% endif %}>
                Targets
            </a>

            <a href="{{ request.url_for('dashboard_telemetry') }}"
               {% if request.url.path == request.url_for('dashboard_telemetry').path %}
               aria-current="page"
               class="text-sm font-semibold text-cyan-400 hover:text-cyan-300"
               {% else %}
               class="text-sm text-slate-300 hover:text-white"
               {% endif %}>
                Telemetry
            </a>

            <a href="/dashboard/analytics"
               {% if request.url.path == request.url_for('dashboard_analytics').path %}
               aria-current="page"
               class="text-sm font-semibold text-cyan-400 hover:text-cyan-300"
               {% else %}
               class="text-sm text-slate-300 hover:text-white"
               {% endif %}>
                Analytics
            </a>

        </nav>

        <main class="mx-auto min-w-0 max-w-7xl px-6 py-8">

            {% block content %}{% endblock %}

        </main>

        <footer class="border-t border-ops-border px-6 py-5">
            <div class="mx-auto max-w-7xl text-xs text-ops-muted">
                M.A.U.R.Y.A. — Reconnaissance Operations Platform
            </div>
        </footer>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
        defer
    ></script>
    {% block scripts %}{% endblock %}

</body>
</html>
